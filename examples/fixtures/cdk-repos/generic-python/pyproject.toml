[project]
name = "cdk-python-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aws-cdk-lib>=2.175.0",
  "constructs>=10.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "aws-cdk.aws-lambda-python-alpha>=2.175.0a0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
