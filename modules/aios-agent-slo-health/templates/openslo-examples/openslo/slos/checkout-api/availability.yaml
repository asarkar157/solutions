apiVersion: openslo/v1
kind: SLO
metadata:
  name: checkout-api-availability
  displayName: Checkout API — 30d availability
  labels:
    service: checkout-api
    team: checkout
spec:
  description: Non-5xx HTTP responses over rolling 30 days
  service: checkout-api
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 30d
      isRolling: true
  indicator:
    metadata:
      name: checkout-api-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(http_requests_total{service="checkout-api",status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(http_requests_total{service="checkout-api"}[5m]))
  objectives:
    - displayName: 99.5% availability
      target: 0.995
