AWSTemplateFormatVersion: "2010-09-09"
Description: Catalog baseline — private S3 bucket with versioning and SSE-S3.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique bucket name suffix (org prefix applied by stack).

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: managed-by
          Value: cfn-author-catalog

Outputs:
  BucketArn:
    Value: !GetAtt DataBucket.Arn
  BucketName:
    Value: !Ref DataBucket
