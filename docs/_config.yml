# Jekyll site for GitHub Pages (source: /docs on default branch).
# https://docs.github.com/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
#
# After your first successful deploy, confirm "baseurl" matches your repository name
# (the path segment in https://<org>.github.io/<repo>/).
title: StackGen solution modules
description: Composable Terraform/OpenTofu modules for StackGen—platform resources, governance, and integrations—with AIOS-ready stacks for solution engineers who need to iterate quickly.
theme: minima

# Project pages: https://<org>.github.io/<repository-name>/
# "baseurl" must be "/<repository-name>" (leading slash, no trailing slash).
# Change url/baseurl/repository if you fork or rename the repo.
url: "https://appcd-dev.github.io"
baseurl: "/solutions"
# Project Pages need baseurl on internal paths: include doc_url.html (see _includes/doc_url.html).
# The Liquid link tag omits baseurl and breaks links on github.io/<repo>/.

# Used by jekyll-github-metadata and Liquid (e.g. module source examples).
repository: appcd-dev/solutions

plugins:
  - jekyll-github-metadata

header_pages:
  - index.md
  - module-catalog.md
  - use-case-catalog.md
  - onboarding/index.md
  - architecture.md
  - rego-policies.md
  - migration-guide.md

markdown: kramdown
# Global pretty URLs. In page front matter, do not use a leading slash on `permalink`
# (e.g. `architecture/`), or GitHub project Pages will drop `baseurl` and links 404.
permalink: pretty
