# OpenTofu fmt, OPA (fmt + check), and OpenTofu validate per module/example root.
# HashiCorp Terraform is interchangeable (same commands). Version: .opentofu-version
# Prerequisites and Make targets: repository README → "Local verification", "Continuous integration".
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentofu-fmt:
    name: OpenTofu fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: tofu fmt -check
        run: tofu fmt -check -recursive

  opa:
    name: OPA (fmt + check)
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "0.70.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -sSL -o /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: opa fmt (check only)
        run: |
          set -euo pipefail
          if ! find . -name '*.rego' -not -path './.git/*' -print -quit | grep -q .; then
            echo "No .rego files."
            exit 0
          fi
          need="$(find . -name '*.rego' -not -path './.git/*' -print0 | xargs -0 opa fmt -l || true)"
          if [[ -n "${need}" ]]; then
            echo "Rego needs formatting:"
            echo "${need}"
            exit 1
          fi
      - name: opa check
        run: |
          chmod +x ./scripts/opa-check-all.sh
          ./scripts/opa-check-all.sh

  persona-length:
    name: Persona length cap + per-module guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard rules enforced in one step (see scripts/verify-persona-length.sh):
      #   1. Every modules/aios-agent-*/personas/**/*.md is within Guild's
      #      15000-byte cap (internal/guild/agentrouter/config.go).
      #   2. Every aios-agent-* module that wires `persona = file(...)` ships
      #      a sibling _persona_guard.tf with the canonical terraform_data
      #      precondition, so a new module can't silently skip the plan-time
      #      guard.
      # Either failure exits non-zero and blocks the PR before terraform apply.
      - name: Verify persona byte cap and per-module guard files
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-persona-length.sh
          ./scripts/verify-persona-length.sh

  workflow-stage-bindings:
    name: Workflow stage bindings (webhook readiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sg_workflow stage_bindings match Guild readiness
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-workflow-stage-bindings.py
          python3 ./scripts/verify-workflow-stage-bindings.py --self-test
          python3 ./scripts/verify-workflow-stage-bindings.py

  opentofu-validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: DB state split — orchestration tftpl smoke render
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-db-state-split-templates.sh
          ./scripts/verify-db-state-split-templates.sh
      - name: Validate all module and example roots
        run: |
          set -euo pipefail
          chmod +x ./scripts/terraform-validate-all.sh
          ./scripts/terraform-validate-all.sh
