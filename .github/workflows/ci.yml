# OpenTofu fmt, OPA (fmt + check), and OpenTofu validate per module/example root.
# HashiCorp Terraform is interchangeable (same commands). Version: .opentofu-version
# Prerequisites, secrets, and Make targets: repository README → "Local verification", "Continuous integration".
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentofu-fmt:
    name: OpenTofu fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: tofu fmt -check
        run: tofu fmt -check -recursive

  opa:
    name: OPA (fmt + check)
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "0.70.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -sSL -o /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: opa fmt (check only)
        run: |
          set -euo pipefail
          if ! find . -name '*.rego' -not -path './.git/*' -print -quit | grep -q .; then
            echo "No .rego files."
            exit 0
          fi
          need="$(find . -name '*.rego' -not -path './.git/*' -print0 | xargs -0 opa fmt -l || true)"
          if [[ -n "${need}" ]]; then
            echo "Rego needs formatting:"
            echo "${need}"
            exit 1
          fi
      - name: opa check
        run: |
          chmod +x ./scripts/opa-check-all.sh
          ./scripts/opa-check-all.sh

  opentofu-validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_releases_stackgen_com: ${{ secrets.STACKGEN_TERRAFORM_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: Validate all module and example roots
        run: |
          set -euo pipefail
          if [[ -z "${TF_TOKEN_releases_stackgen_com:-}" ]]; then
            echo "::warning::Skipping OpenTofu validate: STACKGEN_TERRAFORM_REGISTRY_TOKEN is not set (fork PR or configure this secret on the repository)."
            exit 0
          fi
          chmod +x ./scripts/terraform-validate-all.sh
          ./scripts/terraform-validate-all.sh
